name: Cadastro Cliente
description: Sistema de cadastro de clientes em Flask
version: 1.0.0

build:
  language: python
  framework: flask
  run: python app.py

ports:
  - port: 5000
    protocol: http

env:
  - key: FLASK_ENV
    value: production

volume:
  - path: /data
    description: Arquivos do banco de dados SQLite

healthcheck:
  path: /
  interval: 30
  timeout: 10
  start_period: 10